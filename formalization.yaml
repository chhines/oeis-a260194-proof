version: "v0.4"
project:
  name: "Disproof of the Jump Universality Conjecture for OEIS A260194"
  description: "The sequence starts with three ones and adds the gcd of its current term and its term two places earlier. A finite modular invariant confines its positive jumps to a set of 34 integers and excludes 14. This disproves the assertion that every positive integer occurs as a difference."
  authors:
    - "Colton Hines"
  responsible_maintainers: ["Colton Hines"]
  license: Apache-2.0
classification:
  arxiv: ["math.NT"]
  msc2020: ["11B37", "11B83"]
sources:
  - title: "A finite modular invariant for the jumps of OEIS A260194"
    type: original-proof
    relationship: other
    note: "The result and formal proof were developed in the project from which this repository is ported."
  - title: "OEIS A260194"
    authors: ["Franklin T. Adams-Watters"]
    location: "https://oeis.org/A260194"
    relationship: background
    note: "Source of the recurrence and the positive-difference question."
  - title: "A GCD-Driven Sequence with Universal Jumps"
    authors: ["The Formal Conjectures Authors"]
    location: "https://github.com/google-deepmind/formal-conjectures/blob/2f91d251c07fbbaf9435166d47c11e884a08a6cf/FormalConjectures/OEIS/260194.lean"
    relationship: background
    license: Apache-2.0
    note: "Source of the zero-based recurrence and the quantified proposition being negated."
related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/2f91d251c07fbbaf9435166d47c11e884a08a6cf/FormalConjectures/OEIS/260194.lean"
    relationship: adapts
    note: "The independent Challenge mirrors the catalogue definition and states the negative answer."
status:
  scope: "The compared result is the negation of universality for the specified initial conditions. The development proves that 14 is absent. Exact attainment of every member of the bounding set and minimal period length are outside the compared theorem."
